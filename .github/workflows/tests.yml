
name: Matrix Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository files
        run: |
          pwd
          ls -la
          find . -name "test_opmatrix.c"
          find . -name "OPMATRIX.c"

      - name: Compile tests
        run: |
          gcc -Wall -Wextra -Wpedantic \
            -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            OPMATRIX.c test_opmatrix.c -o test_opmatrix

      - name: Run tests
        run: ./test_opmatrix
